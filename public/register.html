<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account — Cyberflex Industries Portal</title>
  <link rel="stylesheet" href="/css/portal.css">
  <link rel="stylesheet" href="/css/lab.css">
</head>
<body>

  <header class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon">CF</div>
      <div class="brand-name">CYBERFLEX <span>INDUSTRIES</span></div>
    </a>
    <ul class="nav-links">
      <li><a href="/">Overview</a></li>
      <li><a href="/products.html">Enterprise Solutions</a></li>
      <li><a href="/missions.html" style="color: #0284c7; font-weight: 700;">Security Lab Hub</a></li>
    </ul>
    <div class="nav-actions" id="nav-user-slot">
      <a href="/login.html" class="btn btn-secondary btn-sm">Sign In</a>
    </div>
  </header>

  <main class="container" style="max-width: 480px; margin-top: 40px;">
    <div class="card" style="box-shadow: var(--shadow-md);">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--secondary);">Create Customer Account</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Register for enterprise access to order gateways and submit support requests</p>
      </div>

      <div id="reg-alert" class="alert" style="display: none;"></div>

      <form id="reg-form">
        <div class="form-group">
          <label class="form-label" for="full_name">Full Name / Organization</label>
          <input type="text" id="full_name" class="form-control" placeholder="e.g. Alice Walker" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="username">Desired Username</label>
          <input type="text" id="username" class="form-control" placeholder="e.g. alice.walker" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Corporate Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="alice@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create a secure password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Register Account</button>
      </form>

      <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 16px; font-size: 0.875rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="/js/portal.js"></script>
  <script>
    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('full_name').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('reg-alert');

      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, username, email, password })
        });

        const data = await res.json();

        if (data.success) {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = 'Account created successfully! Redirecting to dashboard...';
          alertBox.style.display = 'block';
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          alertBox.className = 'alert alert-danger';
          alertBox.textContent = data.error || 'Registration failed.';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'Server communication error.';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
